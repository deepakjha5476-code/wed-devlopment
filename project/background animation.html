<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background-size: cover;
  background-position: center;
  animation: backgroundChange 15s infinite;
  font-family: sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* Background animation */
@keyframes backgroundChange {
  0% {
    background-image: url('https://source.unsplash.com/1600x900/?nature,water');
  }
  33% {
    background-image: url('https://source.unsplash.com/1600x900/?mountain,sunset');
  }
  66% {
    background-image: url('https://source.unsplash.com/1600x900/?forest,night');
  }
  100% {
    background-image: url('https://source.unsplash.com/1600x900/?nature,water');
  }
}

.content {
  background: rgba(0, 0, 0, 0.5);
  padding: 20px;
  border-radius: 10px;
}
	</style>
</head>
<body>
	<div class="content">
    <h1>Welcome!</h1>
    <img src="D:\wed devlopment\image\guava.jpeg">
  </div>


</body>
</html>
