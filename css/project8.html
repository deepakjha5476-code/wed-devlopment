<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">
		.container{
			width: 100%;
			height: 700px;
/*			border: 2px solid black;*/
			display: grid;
			grid-template-columns: repeat(4, 400px);
			grid-template-rows: 200px 300px 100px 200px;
		}
		.circle{
			width: 100px;
			height: 100px;
			border: 2px solid black;
			border-radius: 50%;
			margin-left: 160px;
			margin-bottom: 20px;
			margin-top: 10px;
		}
		.box{
			border: 2px solid black;
		}
		.box1{
			grid-row:1/3 ;
		}
		.box2{
			grid-column: 2/4;
		}
		.box3{
			grid-column-start: 4;
			grid-row: 1/4;
		}
		.box4{
			grid-column-start: 3;
			grid-row: 2/4;
		}
		.box5{
			grid-column: 1/3;
			grid-row: 3/5;
		}
		.box6{
			grid-column: 3/5;

		}
		@media only screen and (max-width:900px){
			body{
				background-color: blue;
			}
			@media only screen and (min-width:600px) and (max-width:900px){
			body{
				background-color: green;
			}
		}

	</style>
</head>
<body>
	<div class="container">
		<div class="box box1">
			<div class="circle"></div>
			<div class="circle"></div>
				<div class="circle"></div>
				<div class="circle"></div>
		</div>
		<div class="box box2"></div>
		<div class="box box3"></div>
		<div class="box"></div>
		<div class="box box4"></div>
		<div class="box box5"></div>
		<div class="box box6"></div>
	</div>

</body>
</html>
