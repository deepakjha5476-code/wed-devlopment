</!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
  <style>
    h1{
      background-color: lightyellow;
      color: darkblue;
      font-weight: bold;
      }
      h2{
        background-color: lightgray;
        color: green;
       }
        p{
          background-color: lightcyan;
        }
        .red-text{
          color: red;
          background-color: white;
        }
        .highlight{
          background-color: orange;
          color: white;
        }
        #unique{
          color: purple;
          background-color: pink;
        }
        a{
          color: blue;
        }
    }
  </style>
</head>
<body>
	<h1>Practice color and background</h1>
	<h2>This is a subheading</h2>
	<p>This is a normal paragraph with background</p>
	<p class="redText">This is red text on while background </p>
	<p class="Highlight">Highlight text with font and orange background</p>
	<p id="special">This is paragraph uses ID select with different colors</p>
	<a href="#">This is a link</a>

</body>
</html>
