</!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		.container{
			width: 100%;
			height: 100px;
			text-align: center;
			background-color: blue;
		}
		.static{
			width: 100%;
			height: 100px;
			background-color: lightblue;
			opacity: 0.9;
		}
		.relative{
			width: 100%;
			height: 100px;
			position: relative;
			top: 10px;
			left: 20px;
			background-color: lightblue;
			opacity: 0.9;
		}
		.right{
			width: 180px;
			height: 150px;
			background-color: lightblue;
			position:absolute ;
			top: 130px;
			right:150px;

		}
	</style>
</head>
<body>
	<div class="container">
	 <h1>CSS Position property Demo</h1>
    </div>
	<div class="Static">
		<h3>Static Position</h3>
		<p>This is the defautlt position Elements follow the normal flow of the document</p>
	</div>
	<div class="relative">
		<h3>Relative position</h3>
		<p>This box  is move 10px down and 20px right from its normal position.</p>
	</div>
	<div class="right">
	  <h4>Absoiute position</h4>
	  <p>This box is postion relative to the nearest position ancestor</p>
    </div>
</body>
</html>
