</!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		#heading {
		text-align: center;
		font-family: Arial, sans-serif;
		margin-top: 50px;
		}
		
		.box{
			width: 110px;
			height: 60px;
			margin: 10px auto;
			text-align: center;
			font-weight: bold;

		}
		.default{
			background-color: lightgray;

		}
		.padding{
			background-color: lightblue;
			text-align: center;
			margin: 20px auto;
		}
		.border{
			background-color: lightsteelblue;
			padding: 5px solid blue;
			margin: 20px auto;
		}
		.margin{
			background-color: lightgreen;
			margin: 20px auto;
		}
		.outline{
			background-color: pink;
			outline: 3px dashed orangered;
			margin: 20px auto;
		}
		.combined{
			background-color: violet;
			padding: 2px;
			border: 2px solid purple;
			outline: 3px dashed red;
		}

	</style>
</head>
<body>
	<h2 id="heading">Css Box Model Visualizer</h2>
	<p class="box default">Box 1: Default</p>
	<p class="box Padding">Box 2: Padding</p>
	<p class="box Border">Box 3: Border</p>
	<p class="box Margin">Box 4: Margin</p>
	<p class="box Outline">Box 5: Outline</p>
	<p class="box Combined">Box 6: Combined</p>

</body>
</html>
