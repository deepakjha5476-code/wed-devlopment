</!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		.container{
			width: 100%;
			height: 1500px;
			border: 2px solid black;
			display: grid;
			grid-template-columns:repeat(2,400px);
			grid-template-rows: 100px 200px 200px 200px 100px;
			/*justify-content: center;
			align-content: space-between;*/
			place-content: center;/*(align-content justify-content)*/
			gap: 20px;

		}
		.box{
			border: 2px solid black;
			display: grid;
			place-items: center;
		}
		.box1{
			grid-column-start: 1;
			grid-column-end:3 ;

		}
		.box2{
			grid-row-start: 3;
			grid-row-end: 5;
		}
		.box3{
			grid-column-start: 1;
			grid-column-end: 3;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="box box1">1</div>
		<div class="box box1">2</div>
		<div class="box box2">3</div>
		<div class="box">4</div>
		<div class="box">5</div>
		<div class="box box2">6</div>
	</div>

</body>
</html>
