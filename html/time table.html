<html>

	<title> time table</title>

		table, th, td

			border-collapse: collapse;

		<tr>

		<tr>

		</tr>
		<tr>
			<td>math</td>
			<td>science</td>

		</tr>
		<tr>
			<td>math</td>

	</table>


</body>
</html>
