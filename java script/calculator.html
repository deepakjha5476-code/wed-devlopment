<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Calculator</title>
  <style>
    body .container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f4f4f4;
  margin: 0;
  padding: 20px;
 
}

.calculator {
  background-color: #222;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px #000;
  width: 260px;
}

#display {
  width: 100%;
  height: 50px;
  background-color: #000;
  color: #0f0;
  font-size: 24px;
  text-align: right;
  padding: 10px;
  border: none;
  border-radius: 5px;
  margin-bottom: 10px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  height: 50px;
  font-size: 18px;
  border: none;
  border-radius: 5px;
  background-color: black;
  color: white;
}


  </style>
</head>
<body>
  <div class="container">
    <input>
    <div class="buttons">
      <button onclick="()">AC</button>
      <button onclick="('%')">%</button>
      <button onclick="()">c</button>
      <button onclick="('/')">÷</button>

      <button onclickap="('7')">7</button>
      <button onclick="('8')">8</button>
      <button onclick="('9')">9</button>
      <button onclick="('*')">*</button>

      <button onclick="('4')">4</button>
      <button onclick="('5')">5</button>
      <button onclick="('6')">6</button>
      <button onclick="('-')">-</button>

      <button onclick="('1')">1</button>
      <button onclick="('2')">2</button>
      <button onclick="('3')">3</button>
      <button onclick="('+')">+</button>

      <button onclick="('0')">0</button>
      <button onclick="('.')">.</button>
      <button onclick="()" class="equal">=</button>
    </div>
  </div>
</body>
</html>
