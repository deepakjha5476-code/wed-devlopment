<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		*{
			margin: 0px;
		}
		.container{
			width: 100%;
			height: 100%;
			margin: auto;
			background-color: #e0f7fa;
			padding: 20px;
			border-radius: 10px;
		}
		.body{
			width: 350px;
			height: 570px;
			border: 5px solid black;
			border-radius: 20px;
			box-shadow: 5px 5px 10px black;
			margin: auto;
			padding-top: 20px;
			background-image: url(https://wallpapercave.com/wp/wp2732954.jpg);
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
		}
		.display{
			width: 300px;
			height: 100px;
			border: 5px solid grey;
			border-radius: 10px;
			margin: auto;
			background-color: #20222D;
			box-shadow: 5px 5px 5px black;
		}
		button{
			width: 70px;
			height: 70px;
			font-size: 50px;
			margin-top: 20px;
			margin-left: 12px;
			border-radius: 50%;
			box-shadow: 5px 5px 5px black;
			background-color: lightgrey;
			position: relative;
		}
		.clear{
			background-color:#D7762B;
		}
		.zero{
			width: 160px;
			border-radius: 50px;
		}
		.equal{
			width: 240px;
			border-radius: 50px;
			background-color:#D7762B;
		}
		button:hover{
			font-size: 45px;
			width: 65px;
			height: 65px;
		}
		.zero:hover{
			width: 140px;
		}
		.equal:hover{
			width: 220px;
			
	</style>
</head>
<body>
	<div class="container">
		<div class="body">
			<input class="display" type="text">
			<button>7</button>
			<button>8</button>
			<button>9</button>
			<button>/</button>
			<button>4</button>
			<button>5</button>
			<button>6</button>
			<button>*</button>
			<button>1</button>
			<button>2</button>
			<button>3</button>
			<button>+</button>
			<button class="zero">0</button>
			<button>%</button>
			<button>-</button>
			<button class="equal">=</button>
			<button class="clear">C</button>
		</div>
	</div>
	<link rel="script\calculator1.js" type="text/css" href="">
</body>
</html>
